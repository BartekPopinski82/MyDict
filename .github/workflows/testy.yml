name: Testy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testy:
    name: Testy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Biblioteki
        run: python -m pip install -r requirements-build.txt

      - name: Testy
        run: python -m pytest tests -q

      - name: Autotest ze źródeł
        env:
          QT_QPA_PLATFORM: offscreen
        run: python BAPO_Dyktowanie.py --selftest
