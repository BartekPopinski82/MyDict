name: Wydanie

# Wypchnięcie znacznika „vX.Y.Z” buduje instalatory dla Windows i macOS i publikuje
# je jako wydanie GitHub. Z tych wydań program pobiera swoje aktualizacje.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Budowanie (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Biblioteki
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Znacznik zgodny z wersją programu
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python packaging/wydanie.py sprawdz "${GITHUB_REF_NAME}"

      - name: Testy
        # Na macOS testy są informacyjne (pełną bramką jest tam autotest zbudowanej aplikacji).
        continue-on-error: ${{ matrix.name == 'macOS' }}
        run: python -m pytest tests -q

      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Pamięć podręczna drugiego silnika (whisper.cpp)
        id: whispercpp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: whispercpp
          key: whispercpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/build_whispercpp.py') }}

      - name: Vulkan SDK
        if: runner.os == 'Windows' && steps.whispercpp.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name | Select-Object -Last 1
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV

      - name: Drugi silnik — whisper.cpp (Vulkan na Windows, Metal na macOS)
        if: steps.whispercpp.outputs.cache-hit != 'true'
        run: python packaging/build_whispercpp.py

      # Podpis kodu Windows przez Azure Trusted Signing. Włącza się, gdy ustawiona jest
      # zmienna repozytorium AZURE_SIGNING_ACCOUNT (oraz sekrety AZURE_* niżej).
      # Inny dostawca: zamiast tego kroku ustaw własne MYDICT_SIGN_CMD (zob. packaging/build.py).
      - name: Podpis kodu — przygotowanie (Azure Trusted Signing)
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory "$env:RUNNER_TEMP\ts" -NonInteractive
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\ts" -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object FullName -match '\\x64\\' | Select-Object -First 1
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1
          $meta = "$env:RUNNER_TEMP\podpis.json"
          @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE } |
            ConvertTo-Json | Set-Content -Encoding utf8 $meta
          "MYDICT_SIGN_CMD=`"$($signtool.FullName)`" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$($dlib.FullName)`" /dmdf `"$meta`" {plik}" >> $env:GITHUB_ENV

      - name: Budowanie i autotest aplikacji
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # Token zapisu zgłoszeń (zob. dyktowanie_zgloszenia.py) — dołączany do programu przy budowaniu.
          MYDICT_ZGLOSZENIA_TOKEN: ${{ secrets.MYDICT_ZGLOSZENIA_TOKEN }}
          # true = wydanie Windows nie wyjdzie bez podpisu kodu (ustaw po założeniu konta podpisu).
          WYMAGAJ_PODPISU: ${{ vars.WYMAGAJ_PODPISU_KODU }}
        run: |
          extra=""
          if [ "${WYMAGAJ_PODPISU}" = "true" ]; then extra="--require-signature"; fi
          python packaging/build.py --require-whispercpp $extra

      # Pakiet tak, jak dostanie go użytkownik: instalacja, autotest, odinstalowanie.
      - name: Test instalatora
        shell: bash
        run: |
          set -e
          for package in dist/*-Windows-Setup.exe dist/*-macOS-*.dmg; do
            if [ -e "$package" ]; then python packaging/test_instalatora.py "$package"; fi
          done

      # Brak instalatora = brak plików = błąd (if-no-files-found), więc wydanie nie wyjdzie niekompletne.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wydanie-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*-Windows-Setup.exe
            dist/*-macOS-*.zip
            dist/*-macOS-*.dmg
            dist/*.sha256

  publish:
    name: Publikacja wydania
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Sumy kontrolne, podpis i opis zmian
        env:
          # Klucz prywatny wydań (hex) — sekret repozytorium. Bez niego wydanie nie wychodzi:
          # zainstalowane programy odrzucają niepodpisane aktualizacje.
          MYDICT_KLUCZ_WYDAN: ${{ secrets.MYDICT_KLUCZ_WYDAN }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          rm dist/*.sha256
          cat dist/SHA256SUMS.txt
          python3 packaging/wydanie.py podpisz dist/SHA256SUMS.txt
          python3 packaging/wydanie.py sprawdz-podpis dist/SHA256SUMS.txt
          python3 packaging/wydanie.py notatki "${GITHUB_REF_NAME}" > notatki.md
          cat notatki.md

      # Wydanie wychodzi jako „wersja wstępna”: zainstalowane programy go nie widzą
      # (biorą tylko najnowsze pełne wydanie). Po sprawdzeniu instalatora na czystym
      # komputerze udostępnia się je wszystkim workflow „Udostępnij wydanie”.
      - name: Wydanie GitHub (wersja wstępna)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "MyDict ${GITHUB_REF_NAME#v}" \
            --notes-file notatki.md \
            --prerelease \
            --verify-tag
